name: CI

# Roda a suíte de testes e o lint em cada push e pull request para a branch
# principal. Os testes são headless (SDL dummy, ver tests/conftest.py), então
# não precisam de display nem placa de som no runner.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check game tests

      - name: Testes (pytest)
        # SDL dummy também via env, como cinto de segurança além do conftest.
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest -q
