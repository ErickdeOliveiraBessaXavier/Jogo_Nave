[tool.ruff.lint]
select = [
    "F",     # erros reais (undefined, unused imports)
    "E",     # estilo PEP8
    "W",     # warnings
    "F401",  # imports não usados
    "F811",  # redefinição de nome
    "F841",  # variáveis atribuídas mas nunca usadas
]
ignore = [
    "E501",  # line too long
    "W293",  # blank line contains whitespace
]

[tool.vulture]
min_confidence = 80
paths = ["game/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-q` silencioso; sem plugins de descoberta lenta. Os testes rodam headless
# (SDL dummy) via tests/conftest.py.
addopts = "-q"

# Config do pylint vive em .pylintrc (que tem precedência sobre este arquivo
# na auto-descoberta do pylint). Mantida lá para evitar config duplicada.
